[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "claude-account-switch"
version = "0.2.0"
description = "Switch the account Claude Code uses with one command, keeping one shared history. Unofficial."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Abubakr Alsheikh", email = "abubakr.alsheikh@outlook.com" }]
maintainers = [{ name = "Abubakr Alsheikh", email = "abubakr.alsheikh@outlook.com" }]
keywords = ["claude", "claude-code", "accounts", "cli", "oauth"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Utilities",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/Abubakr-Alsheikh/claude-account-switch"
Issues = "https://github.com/Abubakr-Alsheikh/claude-account-switch/issues"

[project.scripts]
claude-switch = "claude_switch:entry"

[tool.setuptools]
py-modules = ["claude_switch"]
