name: test

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.9", "3.12", "3.14", "3.15"]
        utf8: [""]  # Python's own default; the extra job below forces UTF-8 mode
        include:
          - os: windows-latest
            python: "3.13"
            utf8: "1"
    env:
      PYTHONUTF8: ${{ matrix.utf8 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Unit tests (fake profile, fake token server, fake Keychain; no network)
        run: python -m unittest discover -s tests -v
      - name: Package installs and runs
        shell: bash
        env:
          CLAUDE_SWITCH_TEST_HOME: ${{ runner.temp }}
        run: |
          python -m pip install --quiet .
          claude-switch --version
          claude-switch help
